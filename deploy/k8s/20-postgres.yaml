# Single PostgreSQL instance with persistent storage.
# In the lab this is the shared, stateful component that every API replica
# talks to — and, as the report explains, the first scaling bottleneck.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: productsave
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: productsave
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate          # never run two Postgres pods against one PVC
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Raise max_connections above the default 100 so several API replicas,
          # each with its own Npgsql pool, can connect under load without hitting
          # "sorry, too many clients already" (SQLSTATE 53300).
          args: ["-c", "max_connections=300"]
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "productsave", "-d", "productsave"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "productsave", "-d", "productsave"]
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: productsave
  labels:
    app: postgres
spec:
  type: ClusterIP           # internal only — never exposed outside the cluster
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
