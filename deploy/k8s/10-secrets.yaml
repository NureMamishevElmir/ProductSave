# DEMO credentials only — for a real deployment use a sealed secret / external
# secret manager and never commit raw values. Kept inline here so the lab
# cluster can be brought up with a single `kubectl apply -f deploy/k8s`.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: productsave
type: Opaque
stringData:
  POSTGRES_USER: productsave
  POSTGRES_PASSWORD: productsave-strong-pass
  POSTGRES_DB: productsave
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: productsave
type: Opaque
stringData:
  # Double underscore maps to the ASP.NET Core config key ConnectionStrings:DefaultConnection.
  # Host = the Postgres Service name inside the cluster.
  # Maximum Pool Size caps each replica's Npgsql pool so N replicas use at most
  # N*25 connections — staying under Postgres max_connections=300 even at 8
  # replicas, while leaving headroom for the startup migration connection.
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Username=productsave;Password=productsave-strong-pass;Database=productsave;Maximum Pool Size=25"
  Jwt__Key: "lt3sPBPn8IiCuaQKIOwrk9q6jqaUkPyOcUFq9I9KSZz"
  Jwt__Issuer: "ProductSave"
  Jwt__Audience: "ProductSave"
