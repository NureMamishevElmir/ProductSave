# Load balancer in front of the scalable `api` service.
#
# Key trick: we DON'T hardcode an upstream block (it would resolve the api
# hostname once at startup and miss replicas added by `--scale`). Instead we
# use Docker's embedded DNS (127.0.0.11) at request time via a variable in
# proxy_pass, so nginx re-resolves `api` and round-robins across all current
# replica IPs without a reload.
events {}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location / {
            set $api_upstream api:8080;
            proxy_pass http://$api_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
